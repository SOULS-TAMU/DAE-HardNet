name: Repository quality and coverage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml ruff
      - run: python tools/check_repository.py
      - run: python -m ruff check src tests tools
      - name: Extended checks on maintenance tools and tests
        run: python -m ruff check tests tools --select E9,F,B
      - name: Validate GitHub Actions syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
  coverage:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/install_dependencies.py --extras dev --native-only
      - run: python -m pytest -m "not integration" --cov=daehn --cov-branch --cov-report=term --cov-report=xml:coverage.xml --cov-report=json:coverage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-library-coverage
          path: |
            coverage.xml
            coverage.json
