name: Shared KKTHN integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
      KKTHN_SOURCE: ${{ vars.KKTHN_SOURCE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/install_dependencies.py --extras dev
      - run: python -m pytest -m integration
