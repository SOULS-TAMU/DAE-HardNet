name: Shared KKTHN integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
      KKTHN_SOURCE: ${{ vars.KKTHN_SOURCE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python tools/install_dependencies.py --extras dev
      - run: python -m pytest -m integration
