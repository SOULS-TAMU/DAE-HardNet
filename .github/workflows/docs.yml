name: Documentation build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "mkdocs>=1.5"
      - run: python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/
